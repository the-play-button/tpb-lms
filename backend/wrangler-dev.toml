# LMS Worker Configuration
# Deploy with: npx wrangler deploy

name = "lms-api"
main = "index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "lms-db-dev"
database_id = "597a891e-09c0-4ff8-a9be-ec4faac9f395"
migrations_dir = "../db/migrations"

# PAM login-as anti-replay jti store (DPoP). Dedicated per-app PAM_JTI_KV (flat-terrain canonical).
[[kv_namespaces]]
binding = "PAM_JTI_KV"
id = "c7ab8bcafe9642c983cdf13ff520422e"

# Authentication configuration
[vars]
ACCESS_TEAM_DOMAIN = "theplaybutton"
BASTION_URL = "https://bastion-backend.theplaybutton.dev"
TPB_STORAGE_URL = "https://storage-backend.theplaybutton.dev"
CF_ACCESS_CLIENT_ID = "1d40e1d5596067ac01ddca098c6396da.access"
# CF_ACCESS_CLIENT_SECRET — fetche depuis bastion vault au runtime (tpb/infra/cf_access_sa_client_secret)

# Secrets:
# - BASTION_TOKEN (sole bootstrap secret — fetched via wrangler secret put)
# All other secrets are fetched from bastion vault at runtime via initBastionClient().

# Development settings
[dev]
port = 8787
local_protocol = "http"
