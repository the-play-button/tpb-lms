  # seconds instead of one full run per push. A pull request is always judged. An unreadable main fails the run.
  # A push of plans alone starts no run (paths-ignore) : when only such files changed since this commit, no newer run will
  # judge it, so this one does (tpb-cogs run 8830, 2026-11-07, judged nothing behind a push of plans).
