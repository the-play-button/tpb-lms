name: ci
# CI gate on push to main + PR to main (§ CI-partout, closes axes A1/A2/A3).
on:
  push:
    branches: [main]
    # A push of plans alone runs nothing and cancels nothing : 49 of tpb-fleet's 73 runs over 48 h saw only plans change
    # (2026-11-06). The push hook judges those files, and the next run of code reads the whole tree.
    paths-ignore: ['plans/**', 'TODO.md']
  pull_request:
    branches: [main]
  # `tpb ci run` judges any commit, on main or not, pushed under refs/tpb-ci/<id> : the same judge as main, on demand
  # (plan 07.1.1 of tpb-devops/plans/2026-11-01_build-tooling-shared-cache-forgejo).
