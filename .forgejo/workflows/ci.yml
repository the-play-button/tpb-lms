    branches: [main]
    # A push of plans alone runs nothing and cancels nothing : 49 of tpb-fleet's 73 runs over 48 h saw only plans change
    # (2026-11-06). The push hook judges those files, and the next run of code reads the whole tree. Nor does a push of the
    # entropy snapshot alone : a fleet publication ran ~25 full CIs at once on 2026-11-09 (tpb-sdk
    # plans/2026-11-09_a-bastion-read-answers-in-under-a-second, plan 04). The production gate G5 carries the verdict of
    # the newest judged ancestor over such pushes (tpb-devops-cd `_shared/ciIgnoredPaths.ts`, the same list).
