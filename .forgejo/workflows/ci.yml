              const results=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              if(!results.length)throw Error("eslint judged no file");
              const baseline=fs.existsSync(".eslint-last-status.json")?JSON.parse(fs.readFileSync(".eslint-last-status.json","utf8")).eslint_errors:0;
              const errors=results.reduce((sum,result)=>sum+result.errorCount,0);
              console.log(`eslint: ${errors} errors, ${results.length} files, baseline ${baseline}`);
              if(errors>baseline){
