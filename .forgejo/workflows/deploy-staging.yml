name: deploy-staging
# Deploy staging — § restored gates (secrets-check, backup-D1, entropy, smoke fail-hard).
# GROUNDED on WMS deploy-production.yml; env-parameterized by generate_workflows.py.
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
        description: "Commit SHA to deploy (validated staging candidate)"

# One deploy of an environment at a time : two go-live tags of one SHA, 15 s apart, started two production deploys of
# tpb-bastion side by side (2026-11-08, runs 654-657), D1 migrations included. The next one waits, never cancelled.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: tpb-staging-runner
    timeout-minutes: 167
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN_CICD_ACCOUNT_THEPLAYBUTTON_AI }}
      CLOUDFLARE_ACCOUNT_ID: '79d621c1d8e20c3c85009b30099b96e0'
    steps:
      - name: Checkout
        timeout-minutes: 36
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Setup pnpm via corepack
        timeout-minutes: 2
        run: |
          echo '::tpb-step::Setup pnpm via corepack' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Inject npm auth token (global ~/.npmrc)
        timeout-minutes: 2
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          echo '::tpb-step::Inject npm auth token (global ~/.npmrc)' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          cat > "$HOME/.npmrc" <<EOF
          @the-play-button:registry=https://npm.tpb.sh/api/packages/the-play-button/npm/
          //npm.tpb.sh/api/packages/the-play-button/npm/:_authToken=$NPM_AUTH_TOKEN
          EOF
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Install dependencies
        timeout-minutes: 2
        run: |
          echo '::tpb-step::Install dependencies' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          pnpm install --frozen-lockfile
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Gate — Typecheck (tsc --noEmit)
        timeout-minutes: 3
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          echo '::tpb-step::Gate — Typecheck (tsc --noEmit)' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          # Inputs already judged green are not judged again (tpb-devops plans/2026-11-10_ci-queue-under-two-minutes, plans 09.1 and
          # 09.3) : a mark per key in the shared build cache (tpb-build-cache, 14-day expiry). The token reaches curl on its stdin,
          # never as an argument ; a cache that answers anything but 200 or 404 is a warning, and the step judges.
          [ -n "${TURBO_TOKEN:-}" ] || { echo "::error::TURBO_TOKEN is empty : the organisation secret is not wired (tpb-devops scripts/wire_ci_organization_secrets.py set)"; exit 1; }
          inputs_mark_url() { echo "https://build-cache.theplaybutton.ai/v8/artifacts/$1?slug=ci-inputs-verdict"; }
          inputs_seen() {  # $1 key : 0 when these inputs were judged green
            local seen
            seen=$(printf 'header = "Authorization: Bearer %s"\n' "$TURBO_TOKEN" | curl -sS -o /dev/null -w '%{http_code}' -K - -I "$(inputs_mark_url "$1")") || true
            case "$seen" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::warning::the build cache answered ${seen:-nothing} for key $1 : judged" ; return 1 ;;
            esac
          }
          inputs_mark() {  # $1 key : these inputs were judged green
            printf 'header = "Authorization: Bearer %s"\n' "$TURBO_TOKEN" | curl -sS -f -o /dev/null -K - -X PUT -H 'content-type: application/octet-stream' --data-binary "$GITHUB_SHA" "$(inputs_mark_url "$1")" \
              || echo "::warning::the green verdict of key $1 could not be marked : the next run of these inputs judges again"
          }
          code_inputs_key() {  # $1 the step's version : the repository's TS and JS code, every top-level directory holding a .ts, .tsx, .js, .mjs or .cjs file but plans and .forgejo, and every root file but *.md
            { echo "$1 $GITHUB_REPOSITORY $(node --version)"
              git ls-tree HEAD | while read -r _mode type object path; do
                case "$type:$path" in
                  tree:plans|tree:.forgejo|blob:*.md) ;;
                  tree:*) [ -n "$(git ls-files -- "$path/*.ts" "$path/*.tsx" "$path/*.js" "$path/*.mjs" "$path/*.cjs" | head -1)" ] && echo "$object $path" || true ;;
                  *) echo "$object $path" ;;
                esac
              done
            } | sha256sum | cut -c1-64
          }
          # One verdict for the CI and every deploy of a Worker : both render these two steps, byte for byte, under one key. The
          # first to pass them green marks the code, the other skips them. A staging deploy starts in 0 to 4 min, its CI waited up
          # to 19 : the deploy judged first, then the CI judged the same commit again (154 of 394 staging deploy minutes,
          # 2026-11-10 ; tpb-devops plans/2026-11-10_ci-queue-under-two-minutes, plans 05.1 and 09.3).
          code_key="$(code_inputs_key "76eecff4a2c8")"
          echo "$code_key" > "${RUNNER_TEMP:?RUNNER_TEMP is set by the runner}/tpb-typescript-key"
          if inputs_seen "$code_key"; then
            echo "this TS and JS code was already typechecked and tested green (key $code_key) : not judged again"
            : > "$RUNNER_TEMP/tpb-typescript-already-green"
            exit 0
          fi
          pnpm typecheck
          : > "$RUNNER_TEMP/tpb-typecheck-green"
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Gate — Unit tests (vitest)
        timeout-minutes: 32
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          echo '::tpb-step::Gate — Unit tests (vitest)' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          # Inputs already judged green are not judged again (tpb-devops plans/2026-11-10_ci-queue-under-two-minutes, plans 09.1 and
          # 09.3) : a mark per key in the shared build cache (tpb-build-cache, 14-day expiry). The token reaches curl on its stdin,
          # never as an argument ; a cache that answers anything but 200 or 404 is a warning, and the step judges.
          [ -n "${TURBO_TOKEN:-}" ] || { echo "::error::TURBO_TOKEN is empty : the organisation secret is not wired (tpb-devops scripts/wire_ci_organization_secrets.py set)"; exit 1; }
          inputs_mark_url() { echo "https://build-cache.theplaybutton.ai/v8/artifacts/$1?slug=ci-inputs-verdict"; }
          inputs_seen() {  # $1 key : 0 when these inputs were judged green
            local seen
            seen=$(printf 'header = "Authorization: Bearer %s"\n' "$TURBO_TOKEN" | curl -sS -o /dev/null -w '%{http_code}' -K - -I "$(inputs_mark_url "$1")") || true
            case "$seen" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::warning::the build cache answered ${seen:-nothing} for key $1 : judged" ; return 1 ;;
            esac
          }
          inputs_mark() {  # $1 key : these inputs were judged green
            printf 'header = "Authorization: Bearer %s"\n' "$TURBO_TOKEN" | curl -sS -f -o /dev/null -K - -X PUT -H 'content-type: application/octet-stream' --data-binary "$GITHUB_SHA" "$(inputs_mark_url "$1")" \
              || echo "::warning::the green verdict of key $1 could not be marked : the next run of these inputs judges again"
          }
          code_inputs_key() {  # $1 the step's version : the repository's TS and JS code, every top-level directory holding a .ts, .tsx, .js, .mjs or .cjs file but plans and .forgejo, and every root file but *.md
            { echo "$1 $GITHUB_REPOSITORY $(node --version)"
              git ls-tree HEAD | while read -r _mode type object path; do
                case "$type:$path" in
                  tree:plans|tree:.forgejo|blob:*.md) ;;
                  tree:*) [ -n "$(git ls-files -- "$path/*.ts" "$path/*.tsx" "$path/*.js" "$path/*.mjs" "$path/*.cjs" | head -1)" ] && echo "$object $path" || true ;;
                  *) echo "$object $path" ;;
                esac
              done
            } | sha256sum | cut -c1-64
          }
          if [ -f "${RUNNER_TEMP:?RUNNER_TEMP is set by the runner}/tpb-typescript-already-green" ]; then
            echo "this TS and JS code was already typechecked and tested green (the step before says by which key) : not judged again"
            exit 0
          fi
          pnpm test
          if [ -f "$RUNNER_TEMP/tpb-typecheck-green" ] && [ -f "$RUNNER_TEMP/tpb-typescript-key" ]; then
            inputs_mark "$(cat "$RUNNER_TEMP/tpb-typescript-key")"
          fi
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Checkout tpb-entropy (gate source)
        timeout-minutes: 2
        if: success() || failure()
        uses: actions/checkout@v4
        with:
          repository: the-play-button/tpb-entropy
          path: .ci-tpb-entropy
          token: ${{ secrets.FORGEJO_PAT_RO }}
      - name: Gate — Entropy (fail-hard — no-op INTERDIT, § A3)
        timeout-minutes: 35
        if: success() || failure()
        env:
          # The CI check cache shared by every runner (tpb-entropy plan 17.2.1.1.5.1.1.1.1.5, tpb-devops
          # scripts/provision_entropy_check_cache.py): every job reads it, a push to main writes it.
          ENTROPY_CHECK_CACHE_R2_ACCOUNT_ID: ${{ secrets.ENTROPY_CHECK_CACHE_R2_ACCOUNT_ID }}
          ENTROPY_CHECK_CACHE_R2_READ_ACCESS_KEY_ID: ${{ secrets.ENTROPY_CHECK_CACHE_R2_READ_ACCESS_KEY_ID }}
          ENTROPY_CHECK_CACHE_R2_READ_SECRET_ACCESS_KEY: ${{ secrets.ENTROPY_CHECK_CACHE_R2_READ_SECRET_ACCESS_KEY }}
          ENTROPY_CHECK_CACHE_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.ENTROPY_CHECK_CACHE_R2_WRITE_ACCESS_KEY_ID }}
          ENTROPY_CHECK_CACHE_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.ENTROPY_CHECK_CACHE_R2_WRITE_SECRET_ACCESS_KEY }}
        run: |
          echo '::tpb-step::Gate — Entropy (fail-hard — no-op INTERDIT, § A3)' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          set -eu
          # recon-18: the Forgejo PyPI download URLs are absolute-public (CF-Access-gated) → pip on the
          # runner gets the CF challenge HTML → hash-mismatch. Install the gate FROM SOURCE via a
          # cross-repo checkout (Design-B fallback, recon-08); deps are all public PyPI. rm the nested
          # checkout before scanning so `--path .` audits only THIS repo.
          VENVROOT="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is set by the runner}/entropy-gate.XXXXXX")"; trap 'rm -rf "$VENVROOT"' EXIT   # job-unique + EXIT-cleanup (recon-18 v7 collision fix + 2026-10-14 ENOSPC fix: a leaked /tmp/tmp.* filled a runner's disk)
          # Keep the source outside the scanned app until this owned job finishes.
          ENTROPY_SOURCE="$VENVROOT/entropy"
          mv .ci-tpb-entropy "$ENTROPY_SOURCE"
          # The engine's venv is installed once per version of its Python package on this runner, then reused: a fresh venv and
          # a pip install from source took 15.3 s on every pass (tpb-entropy plan 17.2.1.1.5.1.1.1.1.4, 2026-11-08).
          VENV="$(python3 "$ENTROPY_SOURCE/scripts/install_engine_for_ci.py" "$ENTROPY_SOURCE" "${HOME:?}/.tpb-entropy/ci-engines")"
          # Runtime description: the TS resolver owns every path; Python only consumes it.
          # Assign before export so a failed resolver preserves its nonzero exit status.
          TPB_ENTROPY_RUNTIME_RESOURCES="$(node --experimental-strip-types --input-type=module - "$ENTROPY_SOURCE" "$VENV/bin/tpb-entropy" <<'JS'
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const [source, executablePath] = process.argv.slice(2);
          const { resolveEntropyRuntimeResources, describeEntropyRuntimeResources } = await import(
            pathToFileURL(resolve(source, 'backend/entry-ts/_runtimeResources.ts')).href);
          const resources = resolveEntropyRuntimeResources({ environment: process.env, executablePath,
            sourceFallbackRoot: resolve(source, 'python') });
          process.stdout.write(JSON.stringify(describeEntropyRuntimeResources(resources)));
          JS
          )"
          export TPB_ENTROPY_RUNTIME_RESOURCES
          # The check-cache base of this repository is shared by every runner through R2: restored before the scan where
          # this runner has none or only a stale one, sent back after a push to main. A transfer that fails is a warning,
          # never a verdict: the scan then runs on the runner's own base and judges the same.
          CHECK_CACHE_BASE="$(python3 -c 'import json, os; print(json.loads(os.environ["TPB_ENTROPY_RUNTIME_RESOURCES"])["checkCachePath"])')"
          CHECK_CACHE_TRANSPORT="$ENTROPY_SOURCE/scripts/check_cache_through_r2.py"
          python3 "$CHECK_CACHE_TRANSPORT" restore "$CHECK_CACHE_BASE" "${{ github.repository }}" \
            || echo "::warning::the shared entropy check cache was not restored: this scan uses the runner's own base"
          # recon-18 (v6): the runner is Linux, daemon-less + tool-less. Native-only mode
          # runs ONLY the native Python ratchet checks (mega checks need semgrep/trivy/
          # bearer/gitleaks binaries absent here + are non-ratcheted → verdict-equivalent).
          # NO_DAEMON: no compiled daemon on the runner. ENGINE_INTERNAL: bless the cold path.
          # SINGLE_REPO_CI (recon-19): skip the bridged monorepo-context checks that are
          # structurally FALSE POSITIVES + non-deterministic on the flat single-repo checkout.
          # The scan never sees the write pair.
          scan_rc=0
          env -u ENTROPY_CHECK_CACHE_R2_WRITE_ACCESS_KEY_ID -u ENTROPY_CHECK_CACHE_R2_WRITE_SECRET_ACCESS_KEY \
            TPB_ENTROPY_NO_DAEMON=1 TPB_ENTROPY_ENGINE_INTERNAL=1 TPB_ENTROPY_NATIVE_ONLY=1 TPB_ENTROPY_SINGLE_REPO_CI=1 \
            "$VENV/bin/python" -m tpb_entropy --last-status check --path . || scan_rc=$?
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python3 "$CHECK_CACHE_TRANSPORT" save "$CHECK_CACHE_BASE" "${{ github.repository }}" \
              || echo "::warning::the entropy check cache was not shared: the other runners start from their own bases"
          fi
          exit "$scan_rc"
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      # Before the secrets check : a template app's wrangler-<env>.toml exists only once rendered, and the check reads
      # the Worker's name from it (tpb-ats deploy-dev 78 : No such file 'wrangler-dev.toml').
      - name: Materialize public env (staging)
        timeout-minutes: 2
        run: |
          echo '::tpb-step::Materialize public env (staging)' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          python3 scripts/materialize_public_env.py staging
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Gate — Pre-deploy secrets check (§ J3 restored)
        timeout-minutes: 4
        env:
          BASTION_TOKEN: ${{ secrets.BASTION_TOKEN_STAGING }}
          FORGEJO_PYPI_TOKEN: ${{ secrets.FORGEJO_PYPI_TOKEN }}
          FORGEJO_PAT_RO: ${{ secrets.FORGEJO_PAT_RO }}
        run: |
          echo '::tpb-step::Gate — Pre-deploy secrets check (§ J3 restored)' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          set -eu
          # The check calls `tpb bastion check-secret` (tpb-cli >= 0.12.0) : the runner has no `tpb`, install it in a
          # job-unique venv removed on EXIT (no /tmp leak, no PATH side effect on later steps) — same index as tpb-cli CI.
          VENVROOT="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is set by the runner}/entropy-gate.XXXXXX")"; trap 'rm -rf "$VENVROOT"' EXIT; VENV="$VENVROOT/venv"
          python3 -m venv "$VENV" 2>/dev/null || { apt-get install -y -qq python3-venv >/dev/null 2>&1 && python3 -m venv "$VENV"; }
          # Org index MIRRORED with wheel links rewritten to npm.tpb.sh : Forgejo lists files on its ROOT_URL
          # (git.theplaybutton.ai, behind CF Access) even when the index is read via npm.tpb.sh -> pip would download
          # the CF login page (hash mismatch). The rewrite keeps each link's #sha256 (pip still verifies).
          ORG_IDX="$VENVROOT/org-simple"; H="Authorization: token ${FORGEJO_PYPI_TOKEN}"
          for p in $(curl -fsS -H "$H" "https://npm.tpb.sh/api/v1/packages/the-play-button?type=pypi&limit=50" | python3 -c 'import json,sys; print(" ".join(sorted({x["name"] for x in json.load(sys.stdin)})))'); do
            mkdir -p "$ORG_IDX/$p"
            curl -fsS -H "$H" "https://npm.tpb.sh/api/packages/the-play-button/pypi/simple/$p/"               | sed "s#https://git.theplaybutton.ai/#https://token:${FORGEJO_PYPI_TOKEN}@npm.tpb.sh/#g" > "$ORG_IDX/$p/index.html"
          done
          "$VENV/bin/pip" install --quiet             --index-url "file://$ORG_IDX/"             --extra-index-url https://pypi.org/simple/             "tpb-cli>=0.12.0"
          # The kill switch's registry, from its source : the deploy's application token has no right to the vault's mirror.
          curl -fsS -H "Authorization: token $FORGEJO_PAT_RO" "${{ github.server_url }}/api/v1/repos/the-play-button/tpb-devops/raw/tpb-devops-budget-guard/data/cf_workers_registry.yaml" -o "$VENVROOT/workers-registry.yaml"
          PATH="$VENV/bin:$PATH" python3 scripts/pre_deploy_secrets_check.py --app-path . --target staging --bastion-token "$BASTION_TOKEN" --worker-config backend/wrangler-staging.toml --worker-registry "$VENVROOT/workers-registry.yaml"
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Materialize SDK telemetry vars (staging) — backend 500s reach telemetry
        timeout-minutes: 2
        run: |
          echo '::tpb-step::Materialize SDK telemetry vars (staging) — backend 500s reach telemetry' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          node scripts/materialize-telemetry-vars.mjs staging backend/wrangler-staging.toml
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Backup D1 pre-migration (§ G3 — Time Travel restore point before schema change)
        timeout-minutes: 2
        # Bounded : a wrangler that hangs fails this step, named, instead of the job deadline (tpb-kms deploy-production
        # #373, 2026-11-05 : the migration step silent for 20 minutes). tpb-devops sub-54 plan 03.1.
        run: |
          echo '::tpb-step::Backup D1 pre-migration (§ G3 — Time Travel restore point before schema change)' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          set -x
          # D1 Time Travel, not a SQL export: an export refuses any database with a virtual table (FTS5 — tpb-kms deploy-staging
          # run 250, 2026-10-30), makes the database unavailable while it runs, and its .sql stayed on the runner, lost with
          # the job. The bookmark is Cloudflare's own restore point (30 days); it is printed in this log and kept in
          # .d1-backup/. Restore: `wrangler d1 time-travel restore <db> --bookmark <bookmark>`.
          MIGRATIONS_DIR="$(sed -nE 's/^migrations_dir[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' backend/wrangler-staging.toml | head -1)"
          if [ -z "$MIGRATIONS_DIR" ]; then
            echo "backend/wrangler-staging.toml declares no migrations_dir — no D1 migrations for this worker"
          else
            MIGRATIONS_PATH="$(dirname backend/wrangler-staging.toml)/$MIGRATIONS_DIR"
            [ -d "$MIGRATIONS_PATH" ] || { echo "FATAL: backend/wrangler-staging.toml declares migrations_dir=$MIGRATIONS_DIR but $MIGRATIONS_PATH does not exist"; exit 1; }
            mkdir -p .d1-backup
            python3 -c 'import sys, tomllib; [print(d["database_name"]) for d in tomllib.load(open(sys.argv[1], "rb")).get("d1_databases", [])]' backend/wrangler-staging.toml | while read -r DB; do
              echo "Recording the Time Travel restore point of $DB before migration (staging)..."
              POINT=".d1-backup/$DB.$(date -u +%Y%m%dT%H%M%SZ).time-travel.json"
              CI=1 npx -y wrangler@latest d1 time-travel info "$DB" --json --config backend/wrangler-staging.toml > "$POINT" || { echo "FATAL: D1 restore point failed for $DB"; exit 1; }
              grep -q '"bookmark"' "$POINT" || { echo "FATAL: no Time Travel bookmark for $DB"; cat "$POINT"; exit 1; }
              cat "$POINT"
            done
          fi
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Apply D1 migrations (staging)
        timeout-minutes: 2
        # Bounded : a wrangler that hangs fails this step, named, instead of the job deadline (tpb-kms deploy-production
        # #373, 2026-11-05 : the migration step silent for 20 minutes). tpb-devops sub-54 plan 03.1.
        run: |
          echo '::tpb-step::Apply D1 migrations (staging)' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          set -x
          MIGRATIONS_DIR="$(sed -nE 's/^migrations_dir[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' backend/wrangler-staging.toml | head -1)"
          if [ -z "$MIGRATIONS_DIR" ]; then
            echo "backend/wrangler-staging.toml declares no migrations_dir — no D1 migrations for this worker"
          else
            MIGRATIONS_PATH="$(dirname backend/wrangler-staging.toml)/$MIGRATIONS_DIR"
            [ -d "$MIGRATIONS_PATH" ] || { echo "FATAL: backend/wrangler-staging.toml declares migrations_dir=$MIGRATIONS_DIR but $MIGRATIONS_PATH does not exist"; exit 1; }
            python3 -c 'import sys, tomllib; [print(d["database_name"]) for d in tomllib.load(open(sys.argv[1], "rb")).get("d1_databases", [])]' backend/wrangler-staging.toml | while read -r DB; do
              # One read first, one apply, and a stop at the first « overloaded » : never a replay on a loaded database
              # (production bastion 168, 2026-11-05 10:10 UTC : 204 replays, the bastion answered 401 to the portfolio).
              HEALTH="$(CI=1 npx -y wrangler@latest d1 execute "$DB" --remote --command "SELECT 1 AS alive;" --config backend/wrangler-staging.toml 2>&1)" || { echo "$HEALTH"; echo "FATAL: $DB unreadable before its migrations"; exit 1; }
              if printf '%s' "$HEALTH" | grep -qi overloaded; then echo "FATAL: $DB is overloaded — not migrated now"; exit 1; fi
              APPLY="$(CI=1 npx -y wrangler@latest d1 migrations apply "$DB" --remote --config backend/wrangler-staging.toml 2>&1)" && RC=0 || RC=$?
              echo "$APPLY"
              if printf '%s' "$APPLY" | grep -qi overloaded; then echo "FATAL: $DB answered overloaded while migrating — stopped, no replay"; exit 1; fi
              [ "$RC" -eq 0 ] || exit "$RC"
            done
          fi
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Wrangler deploy (staging)
        timeout-minutes: 27
        run: |
          echo '::tpb-step::Wrangler deploy (staging)' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          # PROVENANCE-STAMP COMMIT_SHA (axe 51 bundle==source vérifiable, fleet homogénéisé) — mirror deploy.sh:143.
          COMMIT_SHA="$(git rev-parse HEAD 2>/dev/null || echo nogit)"
          set +e
          npx -y wrangler@latest deploy --config backend/wrangler-staging.toml --var "COMMIT_SHA:${COMMIT_SHA}" 2>&1 | tee .wrangler-deploy.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            # The account has no workers.dev subdomain (deliberately deleted 2026-10-25) and the CF schedules API
            # then refuses any cron write (code 10063) AFTER the version is uploaded and deployed. That alone is not
            # a failure when the live schedules already equal the declared crons; any other error, or a cron drift,
            # fails the job.
            grep -q 'code: 10063' .wrangler-deploy.log || exit "$RC"
            python3 - backend/wrangler-staging.toml <<'PY'
          import json, os, sys, tomllib, urllib.request
          cfg = tomllib.load(open(sys.argv[1], 'rb'))
          declared = sorted((cfg.get('triggers') or {}).get('crons') or [])
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/workers/scripts/{cfg['name']}/schedules",
              headers={'Authorization': f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}"})
          live = sorted(s['cron'] for s in json.load(urllib.request.urlopen(req, timeout=30))['result']['schedules'])
          if live != declared:
              sys.exit(f"cron drift: declared {declared} but live {live}; CF refuses cron writes without a workers.dev subdomain (code 10063)")
          print(f"crons unchanged ({len(live)}) — CF schedules write refused (10063) is harmless here; version deployed")
          PY
          fi
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Smoke test (FAIL-HARD — § G1, curl -f not '|| echo WARN')
        timeout-minutes: 2
        run: |
          echo '::tpb-step::Smoke test (FAIL-HARD — § G1, curl -f not '\''|| echo WARN'\'')' >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          {
          set -x
          sleep 10
          URL="$(grep -E '^\s*(routes|route|workers_dev)' backend/wrangler-staging.toml >/dev/null 2>&1 && echo '' || echo '')"
          # minimal fail-hard smoke: the deploy step already fails on wrangler error;
          # here we assert the health surface responds 2xx. App-specific smoke-recipes = Phase 2 (G2).
          if [ -f scripts/smoke_recipe.sh ]; then
            bash scripts/smoke_recipe.sh staging
          else
            echo "No scripts/smoke_recipe.sh yet — deploy success gate = wrangler exit code (fail-hard). App smoke-recipes = Phase 2 G2."
          fi
          } 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"
          __tpb_rc=${PIPESTATUS[0]}
          [ "$__tpb_rc" -eq 0 ] && echo "::tpb-step-ok::" >> "${RUNNER_TEMP:-/tmp}/tpb-ci-steps.log"; exit "$__tpb_rc"

      - name: Report failure to telemetry
        timeout-minutes: 2
        if: failure()
        env:
          TPB_CI_REDACT_VARS: "BASTION_TOKEN_STAGING,CF_TOKEN_CICD_ACCOUNT_THEPLAYBUTTON_AI,ENTROPY_CHECK_CACHE_R2_ACCOUNT_ID,ENTROPY_CHECK_CACHE_R2_READ_ACCESS_KEY_ID,ENTROPY_CHECK_CACHE_R2_READ_SECRET_ACCESS_KEY,ENTROPY_CHECK_CACHE_R2_WRITE_ACCESS_KEY_ID,ENTROPY_CHECK_CACHE_R2_WRITE_SECRET_ACCESS_KEY,FORGEJO_PAT_RO,FORGEJO_PYPI_TOKEN,NPM_AUTH_TOKEN,TURBO_TOKEN"
          TPB_CI_REPORT_TOKEN: ${{ github.token }}
          BASTION_TOKEN_STAGING: ${{ secrets.BASTION_TOKEN_STAGING }}
          CF_TOKEN_CICD_ACCOUNT_THEPLAYBUTTON_AI: ${{ secrets.CF_TOKEN_CICD_ACCOUNT_THEPLAYBUTTON_AI }}
          ENTROPY_CHECK_CACHE_R2_ACCOUNT_ID: ${{ secrets.ENTROPY_CHECK_CACHE_R2_ACCOUNT_ID }}
          ENTROPY_CHECK_CACHE_R2_READ_ACCESS_KEY_ID: ${{ secrets.ENTROPY_CHECK_CACHE_R2_READ_ACCESS_KEY_ID }}
          ENTROPY_CHECK_CACHE_R2_READ_SECRET_ACCESS_KEY: ${{ secrets.ENTROPY_CHECK_CACHE_R2_READ_SECRET_ACCESS_KEY }}
          ENTROPY_CHECK_CACHE_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.ENTROPY_CHECK_CACHE_R2_WRITE_ACCESS_KEY_ID }}
          ENTROPY_CHECK_CACHE_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.ENTROPY_CHECK_CACHE_R2_WRITE_SECRET_ACCESS_KEY }}
          FORGEJO_PAT_RO: ${{ secrets.FORGEJO_PAT_RO }}
          FORGEJO_PYPI_TOKEN: ${{ secrets.FORGEJO_PYPI_TOKEN }}
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          set -o pipefail
          curl -fsS -H "Authorization: token $TPB_CI_REPORT_TOKEN" "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/raw/scripts/report_ci_failure.py?ref=${{ github.sha }}" | python3 - --repo "${{ github.repository }}" --workflow "${{ github.workflow }}" --ref "${{ github.ref_name }}" --run "${{ github.run_number }}" --environment "staging"
